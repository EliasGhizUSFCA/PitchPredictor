[project]
name = "pitchiq"
version = "0.1.0"
description = "PitchIQ AI - MLB next-pitch prediction research platform"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
  "requests>=2.31",
]

[project.optional-dependencies]
explain = ["shap>=0.45"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pitchiq = "pitchiq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pitchiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
